<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NUTS HEL Satelliittiseuranta</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  /* Full-screen map, one floating status card bottom-left. */
  :root {
    --panel: rgba(18, 24, 20, 0.86);
    --panel-fg: #eef3ec;
    --muted: #a9b8ab;
    --route: #ffd23f;
    --done: #ff6b3d;
    --runner: #ff3d7f;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  html, body { height: 100%; margin: 0; background: #1b211d; font-family: var(--font); }
  [hidden] { display: none !important; }
  #map { position: absolute; inset: 0; }
  .card {
    position: absolute; z-index: 1000; left: 12px; bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    max-width: min(400px, calc(100vw - 24px)); box-sizing: border-box;
    background: var(--panel); color: var(--panel-fg); border-radius: 10px;
    padding: 12px 14px; backdrop-filter: blur(6px); box-shadow: 0 4px 18px rgba(0,0,0,.35);
    font-size: 14px; line-height: 1.4;
  }
  .card h1 { font-size: 16px; margin: 0 0 2px; text-wrap: balance; }
  .card .sub { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  .grid { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-variant-numeric: tabular-nums; }
  .grid dt { color: var(--muted); }
  .grid dd { margin: 0; }
  .bar { height: 6px; background: rgba(255,255,255,.15); border-radius: 3px; margin: 10px 0 4px; overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: var(--done); transition: width .5s; }
  .note { color: var(--muted); font-size: 11px; margin-top: 8px; }
  .row { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .row button { padding: 4px 8px; }
  button {
    font: inherit; font-size: 13px; color: var(--panel-fg); background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.25); border-radius: 6px; padding: 4px 10px; cursor: pointer;
  }
  button[aria-pressed="true"] { background: var(--done); border-color: var(--done); color: #fff; }
  button:focus-visible { outline: 2px solid var(--route); outline-offset: 2px; }
  .err { color: #ffb4a8; }
  .bib {
    background: var(--runner); color: #fff; font: 700 12px/1 var(--font); padding: 4px 7px;
    border: 2px solid #fff; border-radius: 12px; white-space: nowrap; box-shadow: 0 1px 6px rgba(0,0,0,.5);
    transform: translate(-50%, -50%); display: inline-block;
  }
  .split-label {
    background: rgba(255,255,255,.9); color: #222; font: 600 11px/1.2 var(--font);
    padding: 2px 5px; border-radius: 4px; white-space: nowrap;
  }
  .leaflet-tooltip.split-label { border: 0; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
  #event { margin-bottom: 10px; }
  #q, #event {
    width: 100%; box-sizing: border-box; font: inherit; font-size: 16px; color: var(--panel-fg);
    background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.3); border-radius: 6px; padding: 7px 10px;
  }
  #event option, #event optgroup { color: #222; }
  #q:focus-visible, #event:focus-visible { outline: 2px solid var(--route); outline-offset: 1px; }
  #results { list-style: none; margin: 8px 0 0; padding: 0; max-height: 40vh; overflow-y: auto; display: grid; gap: 4px; }
  #results button {
    width: 100%; text-align: left; display: grid; grid-template-columns: 3.2em 1fr; gap: 2px 8px; padding: 6px 8px;
  }
  #results .r-bib { font-weight: 700; font-variant-numeric: tabular-nums; grid-row: span 2; align-self: center; }
  #results .r-meta { color: var(--muted); font-size: 12px; min-width: 0; }
  #runners { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; max-height: 45vh; overflow-y: auto; }
  .runner { border-left: 3px solid var(--c); padding-left: 8px; min-width: 0; }
  .card { color-scheme: dark; }
  .grid dd { min-width: 0; overflow-wrap: anywhere; }
  .r-head { display: flex; gap: 6px; align-items: center; }
  .r-focus {
    flex: 1; min-width: 0; display: flex; gap: 8px; align-items: center; text-align: left;
    background: none; border: 0; padding: 2px 0;
  }
  .pill { background: var(--c); color: #fff; font-weight: 700; font-size: 12px; padding: 2px 7px; border-radius: 10px; font-variant-numeric: tabular-nums; }
  .r-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .r-remove { padding: 1px 8px; }
  .runner .sub { margin: 0; }
  .runner .bar { margin: 5px 0 2px; }
  .runner .bar > div { background: var(--c); }
  .runner .grid { margin-top: 6px; }
  .splits summary { cursor: pointer; color: var(--muted); font-size: 12px; margin-top: 8px; }
  .splits .tbl { overflow-x: auto; }
  .splits table { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; margin-top: 4px; }
  .splits th { color: var(--muted); font-weight: 400; text-align: right; padding: 2px 4px; }
  .splits td { text-align: right; padding: 2px 4px; white-space: nowrap; }
  .splits th:first-child, .splits td:first-child { text-align: left; white-space: normal; padding-left: 0; }
  .splits tr.pred td { color: var(--muted); font-style: italic; }
  /* TV mode (?tv=1): read from across the room, no controls. */
  #tvExit { position: absolute; z-index: 1100; top: 16px; right: 16px; font-size: 18px; padding: 8px 14px; background: var(--panel); }
  .tv .card { font-size: 22px; max-width: min(600px, 40vw); left: 24px; bottom: 24px; padding: 18px 22px; }
  .tv .r-focus { font-size: 26px; }
  .tv .pill { font-size: 20px; padding: 3px 10px; }
  .tv .card .sub { font-size: 16px; }
  .tv .note { font-size: 15px; }
  .tv #runners { max-height: 75vh; gap: 16px; }
  .tv .runner.finishing .r-name::before { content: "🏁 "; }
  .tv .bar { height: 10px; }
  .tv .bib { font-size: 20px; padding: 6px 11px; border-width: 3px; }
  .tv .leaflet-tooltip.split-label { font-size: 16px; }
  .tv #view .row, .tv .r-remove, .tv .splits, .tv .leaflet-control-zoom, .tv .leaflet-control-layers, .tv .r-focus .r-name::after { display: none; }
  @media (max-width: 600px) {
    #tv { display: none; }
    .card { left: 8px; right: 8px; bottom: calc(8px + env(safe-area-inset-bottom, 0px)); max-width: none; padding: 10px 12px; }
    #runners { max-height: 45vh; gap: 8px; }
    .runner .sub, #note.dflt { display: none; }
    .card .leaflet-control-attribution { color: var(--muted); font-size: 10px; line-height: 1.3; margin-top: 6px; }
    .card .leaflet-control-attribution a { color: inherit; }
    .row button { flex: 1 1 auto; padding: 5px 6px; }
  }
  .r-focus[aria-expanded="false"] .r-name::after { content: " ▸"; color: var(--muted); }
  .r-focus[aria-expanded="true"] .r-name::after { content: " ▾"; color: var(--muted); }
  .splits tr.cur td { background: color-mix(in srgb, var(--c) 30%, transparent); }
</style>
</head>
<body>
<div id="map"></div>
<button id="tvExit" type="button" hidden>Poistu TV-tilasta (Esc)</button>
<section class="card" aria-live="polite">
<div id="pick" hidden>
  <h1>Kenen juoksua seurataan?</h1>
  <label class="sub" for="event" style="display:block">Tapahtuma</label>
  <select id="event"><option>Ladataan…</option></select>
  <label class="sub" for="q" style="display:block">Hae nimellä tai numerolla</label>
  <input id="q" type="search" autocomplete="off" enterkeyhint="search" placeholder="esim. Virtanen tai 168">
  <ul id="results"></ul>
  <div class="note" id="pickNote">Haku löytää matkaan lähteneet juoksijat.</div>
  <div class="row"><button id="back" type="button" hidden>Takaisin seurantaan</button></div>
</div>
<div id="view" hidden>
  <ul id="runners"></ul>
  <div class="row">
    <button id="follow" type="button" aria-pressed="true">Seuraa</button>
    <button id="fit" type="button">Koko reitti</button>
    <button id="add" type="button">+ Juoksija</button>
    <button id="share" type="button">Jaa linkki</button>
    <button id="tv" type="button" title="Isot tekstit, ei nappeja, vaihtaa juoksijaa automaattisesti. Esc palaa." aria-label="TV-tila">TV</button>
  </div>
  <div class="note dflt" id="note">Sijainti on ajanottoon perustuva arvio, ei GPS.</div>
</div>
</section>
<script type="module" src="js/app.js"></script>
</body>
</html>
